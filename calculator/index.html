<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Calculator</title>
  </head>
  <body class=" bg-[#3B4664]">
    <div class=" max-w-[1500px] w-full mx-auto h-auto">

      <div class="flex  px-[2rem] xl:px-[32rem] my-[5rem] w-full flex-col gap-7">
        <div class=" flex justify-between">
            <div class=" text-[white] text-2xl font-bold  tracking-[3px]">calculator</div>
      
        </div>
        <div class=" bg-[#191F32] h-[120px] w-full rounded-[8px]" >
            <div id="numberDisplay" class=" text-white px-3 py-12 text-3xl ">

            </div>
        </div>
        <div class=" bg-[#242E44] h-[420px] rounded-[8px] "> 
        <div class=" grid  grid-cols-4 grid-rows-4 p-5 gap-5" >
                <div class=" h-[60px] w-full bg-[#EBE3DC] flex justify-center item-center text-2xl font-semibold text-[#423E3D] rounded-[6px] hover:bg-[grey] hover:text-[white] transition-all duration-300" ><button class="btn w-full " >7</button></div>
                <div class=" h-[60px] w-full bg-[#EBE3DC] flex justify-center item-center text-2xl font-semibold text-[#423E3D] rounded-[6px] hover:bg-[grey] hover:text-[white] transition-all duration-300" ><button class="btn w-full">8</button></div>
                <div class=" h-[60px] w-full bg-[#EBE3DC] flex justify-center item-center text-2xl font-semibold text-[#423E3D] rounded-[6px] hover:bg-[grey] hover:text-[white] transition-all duration-300" ><button class="btn w-full">9</button></div>
                <div class=" h-[60px] w-full bg-[#657296] flex justify-center item-center text-2xl font-semibold text-[white] rounded-[6px] hover:bg-[grey] hover:text-[white] transition-all duration-300" id="del"><button>DEL</button></div>
                <div class=" h-[60px] w-full bg-[#EBE3DC] flex justify-center item-center text-2xl font-semibold text-[#423E3D] rounded-[6px] hover:bg-[grey] hover:text-[white] transition-all duration-300"><button class="btn w-full">4</button></div>
                <div class=" h-[60px] w-full bg-[#EBE3DC] flex justify-center item-center text-2xl font-semibold text-[#423E3D] rounded-[6px] hover:bg-[grey] hover:text-[white] transition-all duration-300"><button class="btn w-full">5</button></div>
                <div class=" h-[60px] w-full bg-[#EBE3DC] flex justify-center item-center text-2xl font-semibold text-[#423E3D] rounded-[6px] hover:bg-[grey] hover:text-[white] transition-all duration-300"><button class="btn w-full">6</button></div>
                <div class=" h-[60px] w-full bg-[#EBE3DC] flex justify-center item-center text-3xl font-semibold text-[#423E3D] rounded-[6px] hover:bg-[grey] hover:text-[white] transition-all duration-300"><button class="btn w-full">+</button></div>
                <div class=" h-[60px] w-full bg-[#EBE3DC] flex justify-center item-center text-2xl font-semibold text-[#423E3D] rounded-[6px] hover:bg-[grey] hover:text-[white] transition-all duration-300"><button class="btn w-full">1</button></div>
                <div class=" h-[60px] w-full bg-[#EBE3DC] flex justify-center item-center text-2xl font-semibold text-[#423E3D] rounded-[6px] hover:bg-[grey] hover:text-[white] transition-all duration-300"><button class="btn w-full">2</button></div>
                <div class=" h-[60px] w-full bg-[#EBE3DC] flex justify-center item-center text-2xl font-semibold text-[#423E3D] rounded-[6px] hover:bg-[grey] hover:text-[white] transition-all duration-300"><button class="btn w-full">3</button></div>
                <div class=" h-[60px] w-full bg-[#EBE3DC] flex justify-center item-center text-4xl font-semibold text-[#423E3D] rounded-[6px] hover:bg-[grey] hover:text-[white] transition-all duration-300"><button class="btn w-full">-</button></div>
                <div class=" h-[60px] w-full bg-[#EBE3DC] flex justify-center item-center text-4xl font-semibold text-[#423E3D] rounded-[6px] hover:bg-[grey] hover:text-[white] transition-all duration-300"><button class="btn w-full">.</button></div>
                <div class=" h-[60px] w-full bg-[#EBE3DC] flex justify-center item-center text-2xl font-semibold text-[#423E3D] rounded-[6px] hover:bg-[grey] hover:text-[white] transition-all duration-300"><button class="btn w-full">0</button></div>
                <div class=" h-[60px] w-full bg-[#EBE3DC] flex justify-center item-center text-3xl font-semibold text-[#423E3D] rounded-[6px] hover:bg-[grey] hover:text-[white] transition-all duration-300"><button class="btn w-full">/</button></div>
                <div class=" h-[60px] w-full bg-[#EBE3DC] flex justify-center item-center text-3xl font-semibold text-[#423E3D] rounded-[6px] hover:bg-[grey] hover:text-[white] transition-all duration-300"><button class="btn w-full">*</button></div>
                <div class=" h-[60px] w-full bg-[#EBE3DC] flex justify-center item-center text-3xl font-semibold text-[#423E3D] rounded-[6px] hover:bg-[grey] hover:text-[white] transition-all duration-300"><button class="btn w-full">(</button></div>
                <div class=" h-[60px] w-full bg-[#EBE3DC] flex justify-center item-center text-3xl font-semibold text-[#423E3D] rounded-[6px] hover:bg-[grey] hover:text-[white] transition-all duration-300"><button class="btn w-full">)</button></div>
                <div class=" h-[60px] w-full bg-[#D23E30] flex justify-center item-center text-2xl font-semibold text-[white] rounded-[6px] hover:bg-[grey] hover:text-[white] transition-all duration-300 col-span-1 " ><button class="w-full" id="reset">RESET</button></div>
                <div class=" h-[60px] w-full bg-[#647296] flex justify-center item-center text-3xl font-semibold text-[white] rounded-[6px] hover:bg-[grey] hover:text-[white] transition-all duration-300 col-span-1" ><button class="w-full" id="isEqual">=</button></div>
            </div>

        </div>
      </div>
    </div>


    <script src="script.js"></script>
  </body>
</html>
