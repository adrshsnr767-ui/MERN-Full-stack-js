<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignIn</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            overflow: hidden;
            box-sizing: border-box;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }


        .background {
            display: flex;





        }
       
        
        .image {
            width: 32vw;
            height: 100vh;



        }

        .image>img {

            width: 100%;
            height: 100%;
        }

        .image>p {
            position: absolute;
            bottom: 60%;
            

            font-size: 2em;
            font-weight: bold;
color: #586b8a;
            padding-left: 1.3em;
            word-wrap: break-word;

        }

        .details {
            width: 68vw;
            height: 100vh;

        }

        #logo {
            position: absolute;
            top: 10%;
            width: 50%;
            padding-left: 2rem;
        }

        .signup-bar {
            height: 11vh;
            display: flex;
            align-items: center;
            flex-direction: row-reverse;
            margin-top: 5rem;
            padding-right: 5rem;
            gap: 1.5rem;
        }
        .signup-bar>a{
            height: 100%;
            width: 13vw;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
        }

        .signup-bar>a>button {
            cursor: pointer;
            font-weight: bold;
            border-radius: 10px;
            border: none;
            color: white;
            background-color: rgb(255, 15, 71);
            width: 11rem;
            height: 4rem;
            transition-duration: 0.4s;
        }

        .signup-bar>a>button:hover {
            transform: scale(1.1);
        }


        .info {
            margin-top: 8rem;
            margin-left: 15rem;
            margin-right: 10rem;
            height: 55%;
            padding: 1rem;
            width: 32vw;
        }

        fieldset {
            margin-bottom: 1rem;
            height: 9vh;
            border-radius: 5px;
        }

        .sigin-space {
            height: 11vh;
            width: 100%;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;

            margin-top: 2rem;
            overflow: visible;



        }
        .buttn-signin{
            
            height: 5rem;
            /* width: 10rem; */
        }
        .buttn-signin>a{
            height: 100%;     
        display: flex;
            align-items: center;
            justify-content: center; 
         }

        .buttn-signin>a>button {
            cursor: pointer;
            font-weight: bold;
            border-radius: 10px;
            border: none;
            color: white;
            background-color: rgb(15, 83, 255);
            width: 10rem;
            height: 4rem;
            transition-duration: 0.4s;
            margin-left: 1rem;
            margin-right: 1rem;
            

        }

        .buttn-signin>a>button:hover {
            transform: scale(1.1);
        }


        .forgot {
            cursor: pointer;
            color: rgb(89, 89, 255);
            transition-duration: 0.4ms;
        }

        .forgot:hover {
            color: grey;
        }

        
    </style>
</head>

<body>



    <div class="background">
        <div class="image">
            <img src="bg1.jpg" alt="background">

            <div id="logo">
                <img src="logo.png" width="250" alt="logo">
            </div>



            <p>We offer
                <br>The
                <br>
                Best 
                <br>Product

            </p>
        </div>



        <div class="details">


            <div class="signup-bar">


               <a href="login.html"> <button>Sign Up Now</button></a>

                <div style=" font-size: 1.1rem; font-weight: lighter;">
                    Not a Member?
                </div>

            </div>


            <div class="info">
                <div>
                    <h2 style="margin-bottom: 1rem; font-size: 2em;">
                        Sign in to eTrade
                    </h2>

                    <p style="font-size: 1em; margin-bottom: 2.8rem; color: gray;">Enter your detail below</p>
                </div>

                <div>
                    <fieldset>
                        <legend>Email</legend>
                        <input type="email" name="name" id="name" placeholder="annie@example.com"
                            style="border: none ; padding: 0.8rem; width: 100%; height: 100%; outline: none;">
                    </fieldset>
                    <fieldset>
                        <legend>Password</legend>
                        <input type="password" placeholder="........" style="border: none; padding: 0.8rem; outline: none; width: 100%; height: 100%;">
                    </fieldset>
                </div>


                <div class="sigin-space">
                    <div class="buttn-signin">
                       <a href="index.html" > <button>
                            Sign in
                        </button></a>
                    </div>


                    <span class="forgot">
                        forgot password?
                    </span>
                </div>
            </div>
        </div>
    </div>


</body>

</html>
