<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }

        body {
            height: 100vh;

            background: linear-gradient(169deg,
                    #1a1a2e 0%,
                    #16213e 35%,
                    #0f3460 100%);
        }

        .navigation {
            display: flex;
            background-color: #0d1117;
            height: 20vh;
            width: 100vw;
            color: #ffffff;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            flex-direction: row;
            align-items: center;
            justify-content: space-around;
            flex-wrap: wrap;

        }

        h2 {
            font-weight: lighter;
            font-size: 3em;
            cursor: pointer;
            color: #a0c4ff;
        }

        .info {

            cursor: pointer;
            font-weight: lighter;
            font-size: 18px;
            display: inline-block;
            margin-right: 50px;
            transition-duration: 0.4s;




        }

        .info:hover {
            background-color: grey;
            border-radius: 2px;
            padding: 5px;

        }

        a {
            text-decoration: none;
            
            
            color: #ffffff;
            

        }
        .active{
            /* text-decoration: none; */
            color:#f5f5dc;
            border-bottom: solid 1px;

        }

        .Hire {
            font-size: 18px;
            background-color: rgb(109, 190, 231);
            color: #f5f5dc;
            width: 130%;
            height: 6vh;
            border: solid grey 1px;
            border-radius: 30px;
            transition-duration: 0.4s;
            cursor: pointer;
        }

        .Hire:hover {
            background-color: grey;
            color: white;
        }

        .hero {
            display: flex;
            flex-wrap: wrap;
            flex-direction: column;
            padding-left: 5%;
            margin-top: 10vh;
        }

        .herodiv {
            display: flex;
            align-items: center;

        }

        .butonlogin {
            display: flex;
            padding-left: 5%;
            margin-top: 10vh;
            height: 10vh;
            margin-top: 3vh;


        }

        .login>button {

            border: solid;
            width: 150px;
            height: 50px;
            border-radius: 30px;
            border: solid gray 1px;

            transition-duration: 0.4s;
            margin-top: 15px;
            cursor: pointer;
            background-color: rgb(109, 190, 231);
            color: beige;
            font-size: 18px;

        }

        .login>button:hover {

            background-color: grey;
        }


        .butonlogin :nth-child(2) {
            margin-left: 13px;
        }
    </style>
</head>

<body>
    <div>
        <nav class="navigation">
            <div>
                <h2> MyPortfolio</h2>
            </div>

            <div>
                <div style="color: beige">
                    <a href="index.html" class="info active">
                        Home
                    </a>
                    <a href="about.html" class="info active">
                        About
                    </a>
                    <a href="project.html" class="info active">
                        Projects
                    </a>
                    <a href="contact.html" class="info active">
                        Contact
                    </a>
                </div>

            </div>
            <div>
                <button class="Hire">Hire Me</button>
            </div>

        </nav>


        <!-- break -->
        <main>
            <div class="herodiv">
                <div class="hero">

                    <div style="color: #a0c4ff; font-size: 2em; font-weight: lighter; ">
                        Hello, I'm
                    </div>
                    <div
                        style="color:#ffffff; font-size: 3em; font-weight: lighter; font-family:'Times New Roman', Times, serif">
                        <h1>Aadarsha Sunar</h1>


                    </div>
                    <div style="color:#a0c4ff; font-size: 2em; font-weight: lighter;">
                        Web Developer & Designer
                    </div>
                    <div style="color: #b0b8c8; font-size: 1.5em; font-weight: lighter;">
                        I build clean, modern websites and love turning ideas into real
                        digital experiences. Currently studying BIT and open to freelance
                        work.
                    </div>
                </div>


                <div ">
                    <img src=" user.png" alt="user" width="80%"
                    style="margin-top: 10vh; padding-left: 5vw; padding-right:5vw ;">
                </div>
            </div>





            <div class="butonlogin">
                <div class="login"><button>View My Projects</button></div>
                <div class="login"><button>Contact Me</button></div>
            </div>
        </main>
    </div>
</body>
</html>
