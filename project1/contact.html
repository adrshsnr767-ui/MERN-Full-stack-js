<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
      }

      header {
      background-color: #0d1117;
        border: solid 1px rgb(36, 33, 119);
        display: flex;
        padding: 30px;
        height: auto;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: space-between;
        align-content: space-between;
        align-items: flex-end;
        position: sticky;
        top: 0;
      }

      .info {
        cursor: pointer;
        font-weight: lighter;
        font-size: 18px;
        display: inline-block;
        /* margin-right: 50px; */
        transition-duration: 0.4s;
        color: beige;
        margin-right: 20px;
      }

      .info:hover {
        background-color: grey;
        border-radius: 10px;
      }

      .contact {
        display: flex;
        flex-wrap: wrap;
        align-items: center;

        background: linear-gradient(
          90deg,
          rgba(2, 0, 36, 1) 0%,
          rgba(9, 9, 121, 1) 41%,
          rgba(0, 212, 255, 1) 80%
        );
        padding: 30px;
      }

      .body {
        height: 100%;

        background: linear-gradient(
          169deg,
          rgba(2, 0, 36, 1) 0%,
          rgba(9, 9, 121, 1) 35%,
          rgba(0, 212, 255, 1) 100%
        );
        color: beige;
        padding-bottom: 20px;
      }

      h1 {
        font-weight: lighter;
        font-size: 55px;
      }

      a {
        text-decoration: none;
        color: inherit;
      }

      .mainline {
        color: #00d4ff;
        margin-bottom: 20px;
        font-size: 20px;
        font-weight: lighter;
      }

      .formbox,
      .contactbox {
        border: solid 1px rgb(36, 33, 119);
        border-radius: 30px;
        padding: 30px;
        margin: 30px;
        background: #020024;
        background: linear-gradient(
          90deg,
          rgba(2, 0, 36, 1) 100%,
          rgba(3, 3, 61, 1) 100%,
          rgba(0, 212, 255, 1) 100%
        );
        color: #e0e0e0;
        /* off white */
        font-weight: lighter;
      }

      .contform {
        display: grid;
        grid-auto-flow: column;
        margin-bottom: 20px;
      }

      label {
        color: #00d4ff;
      }

      #name,
      #email,
      #subject,
      #Phone,
      #Message {
        background-color: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(0, 212, 255, 0.3);
        border-radius: 8px;
        color: #e0e0e0;
        padding: 10px;
        width: 100%;
      }

      button {
        background-color: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(0, 212, 255, 0.3);
        border-radius: 8px;
        color: #e0e0e0;
        padding: 10px;
        width: 100%;
        transition-duration: 0.4s;
      }

      button:hover {
        background-color: #020024;
      }
      .map{
        
         border: solid 1px rgb(36, 33, 119);
        border-radius: 30px;
        padding: 30px;
        margin: 30px;
        
        background: linear-gradient(
          90deg,
          rgba(2, 0, 36, 1) 100%,
          rgba(3, 3, 61, 1) 100%,
          rgba(0, 212, 255, 1) 100%
        );
        color: #e0e0e0;
        
        font-weight: lighter;
      }

      .map>iframe{
        border-radius: 10px;
      }
    </style>
  </head>

  <body>
    <header>
      <div>
        <h2 style="color: cadetblue; font-weight: lighter">MyPortfolio</h2>
      </div>
      <div style="color: beige">
        <a href="index.html">
          <h3 class="info">Home</h3>
        </a>
        <a href="about.html">
          <h3 class="info">About</h3>
        </a>
        <a href="project.html">
          <h3 class="info">Projects</h3>
        </a>
        <a href="contact.html">
          <h3 class="info">Contact</h3>
        </a>
      </div>
    </header>

    <div class="body">
      <div class="contact">
        <div style="margin-left: 10px">
          <h1>Contact Me</h1>
          <p style="color: #00d4ff; font-weight: lighter; font-size: 20px">
            Any specific question? Message Me.
          </p>
        </div>
      </div>

      <main>
        <div class="formbox">
          <div class="mainline">
            SEND A MESSAGE
            <hr style="color: #00d4ff" />
          </div>

          <form>
            <div class="contform">
              <div style="width: 40vw">
                <label for="name">Name</label>
                <br />
                <input
                  type="text"
                  name="name"
                  id="name"
                  placeholder="Your Name"
                />
              </div>
              <div style="width: 40vw">
                <label for="email">Email</label>
                <br />
                <input
                  type="email"
                  name="email"
                  id="email"
                  placeholder="someone@gmail.com"
                />
              </div>
            </div>

            <div class="contform">
              <div style="width: 40vw">
                <label for="Phone">Phone</label>
                <br />
                <input
                  type="number"
                  name="Phone"
                  id="Phone"
                  placeholder="+977 98XXXXXXXX"
                />
              </div>
              <div style="width: 40vw">
                <label for="subject">Subject</label>
                <br />
                <input
                  type="text"
                  name="subject"
                  id="subject"
                  placeholder="Subject here"
                />
              </div>
            </div>

            <div style="width: 85vw">
              <label for="Message">Message</label>
              <br />
              <textarea
                name="MESSAGE"
                id="Message"
                style="height: 12vh"
                placeholder="Type your message here..."
              ></textarea>
            </div>

            <div style="width: 10vw; margin-top: 10px">
              <button>Send message</button>
            </div>
          </form>
        </div>
      </main>

      <div class="contactbox">
        <div class="mainline">
          SEND A MESSAGE
          <hr style="color: #00d4ff" />
        </div>

        <div>
          <svg
            width="20px"
            height="20px"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M2 6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6zm3.519 0L12 11.671 18.481 6H5.52zM20 7.329l-7.341 6.424a1 1 0 0 1-1.318 0L4 7.329V18h16V7.329z"
              fill="#00d4ff"
            />
          </svg>
          <span style="margin-top: 0px; padding: 0px;">aadarsha@gmail.com</span>
        </div>
        <div>
          <svg
            fill="#000000"
            width="20px"
            height="20px"
            viewBox="0 0 24 24"
            id="phone"
            data-name="Line Color"
            xmlns="http://www.w3.org/2000/svg"
            class="icon line-color"
          >
            <path
              id="primary"
              d="M21,15v3.93a2,2,0,0,1-2.29,2A18,18,0,0,1,3.14,5.29,2,2,0,0,1,5.13,3H9a1,1,0,0,1,1,.89,10.74,10.74,0,0,0,1,3.78,1,1,0,0,1-.42,1.26l-.86.49a1,1,0,0,0-.33,1.46,14.08,14.08,0,0,0,3.69,3.69,1,1,0,0,0,1.46-.33l.49-.86A1,1,0,0,1,16.33,13a10.74,10.74,0,0,0,3.78,1A1,1,0,0,1,21,15Z"
              style="
                fill: #020024;
                stroke: #00d4ff;
                stroke-linecap: round;
                stroke-linejoin: round;
                stroke-width: 2;
              "
            ></path>
          </svg>
          <span style="margin-top: 0px; padding: 0px;">+977 98XXXXXXXX</span>
        </div>
        <div>
          <svg
            width="20px"
            height="20px"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
            
          >
            <path
              style="fill: #020024; stroke: #00d4ff "
              d="M18,4.48a8.45,8.45,0,0,0-12,12l5.27,5.28a1,1,0,0,0,1.42,0L18,16.43A8.45,8.45,0,0,0,18,4.48ZM16.57,15,12,19.59,7.43,15a6.46,6.46,0,1,1,9.14,0ZM9,7.41a4.32,4.32,0,0,0,0,6.1,4.31,4.31,0,0,0,7.36-3,4.24,4.24,0,0,0-1.26-3.05A4.3,4.3,0,0,0,9,7.41Zm4.69,4.68a2.33,2.33,0,1,1,.67-1.63A2.33,2.33,0,0,1,13.64,12.09Z"
            />
          </svg>
          <span style="margin-top: 0px; padding: 0px;">Kathmandu, Nepal</span>
        </div>
      </div>
<div >
      <div class="map">
        <div class="mainline">
          My location
          <hr style="color: #00d4ff" />
        </div>
    <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d1570.507981658186!2d85.33188214030653!3d27.696572510453034!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sne!2snp!4v1779536008867!5m2!1sne!2snp" 
    width="100%" height="500" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade" ></iframe>

</div>


    </div>
  </body>
</html>
