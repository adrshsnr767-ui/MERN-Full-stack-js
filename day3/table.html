<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table,
        th,
        td {
            border: 2px solid;
            border-collapse: collapse;
        }
    </style>
</head>

<body>
    <!-- flexbox froggy-->
     <!-- css grid garden -->
    <h1>tables inhtml</h1>
    <table>
        <tr>
            <th>columm1</th>
            <th>colum2</th>
            <th>colum3</th>
        </tr>


    
    <tbody>
        <tr>
            <td rowspan="2">row1 cell1</td>
            <td>row1 cell2</td>
            <td>row1 cell3</td>
        </tr>
    

    <tr>
        <td>row2 cell2</td>
        <td>row2 cell3</td>
    </tr>

    </tbody>
    <tfoot>
        <tr>
            <td colspan="3">row3 cell1</td>
        </tr>
    </tfoot>
    </table>
</body>

</html>
